<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>My Books - MTS சுவடி</title>

  <link
    rel="manifest"
    href="manifest.json"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <link
    rel="stylesheet"
    href="styles.css"
  >

</head>


<body onload="loadStudentBooks()">


  <!-- ======================================================
       TOP HEADER
       ====================================================== -->

  <header class="topbar">


    <!-- BACK -->

    <button
      class="icon-button"
      type="button"
      aria-label="Back"
      onclick="goBack()"
    >
      ←
    </button>


    <!-- MTS LOGO -->

    <img
      class="app-logo"
      src="icons/mts-logo.png"
      alt="MTS"
    >


    <!--
      This starts as My Books.

      app.js will change it to the student's name
      automatically when opened by an Admin.
    -->

    <div
      class="page-title"
      id="student-books-page-title"
    >
      My Books
    </div>


    <!-- REFRESH -->

    <button
      class="icon-button"
      type="button"
      aria-label="Refresh"
      onclick="refreshPage()"
    >
      ↻
    </button>


  </header>



  <!-- ======================================================
       BOOK GROUPS
       ====================================================== -->

  <main id="student-book-groups">

    Loading...

  </main>



  <!-- ======================================================
       NORMAL STUDENT / FAMILY BOTTOM NAVIGATION
       ====================================================== -->

  <nav
    class="bottom-nav"
    id="student-books-family-nav"
  >


    <!-- MTS SUVADI -->

    <a
      class="nav-item"
      href="./index.html"
    >

      <span class="nav-icon">
        ⌂
      </span>

      <span class="nav-label">
        MTS சுவடி
      </span>

    </a>



    <!-- MY BOOKS -->

    <a
      class="nav-item active"
      href="./books.html"
    >

      <span class="nav-icon">
        📚
      </span>

      <span class="nav-label">
        My Books
      </span>

    </a>


  </nav>



  <!-- ======================================================
       ADMIN BOTTOM NAVIGATION
       ======================================================

       Hidden normally.

       app.js displays this only when:

       ?mode=admin

       ====================================================== -->

  <nav
    class="bottom-nav"
    id="student-books-admin-nav"
    hidden
  >


    <a
      class="nav-item active"
      href="./index.html"
    >

      <span class="nav-icon">
        ⌂
      </span>

      <span class="nav-label">
        MTS சுவடி
      </span>

    </a>


  </nav>



  <!-- ======================================================
       FIREBASE
       ====================================================== -->

  <script
    src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app-compat.js"
  ></script>

  <script
    src="https://www.gstatic.com/firebasejs/11.6.0/firebase-auth-compat.js"
  ></script>

  <script
    src="https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore-compat.js"
  ></script>



  <!-- ======================================================
       SUVADI
       ====================================================== -->

  <script src="firebase-config.js"></script>

  <script src="data.js"></script>

  <script src="app.js"></script>


</body>

</html>
