<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MTS சுவடி</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-button" type="button" aria-label="Menu" onclick="toggleSuvadiMenu()">☰</button>
    <img class="app-logo" src="icons/mts-logo.png" alt="MTS">
    <div class="page-title">MTS சுவடி</div>
    <button class="icon-button" type="button" aria-label="Search">⌕</button>
    <button class="icon-button" type="button" aria-label="Refresh" onclick="refreshPage()">↻</button>
  </header>

  <div id="suvadi-menu" hidden style="position:fixed;z-index:20;top:58px;left:10px;background:white;padding:12px;border-radius:10px;box-shadow:0 3px 18px #0003;">
    <button type="button" onclick="signOutSuvadi()">Sign out</button>
  </div>

  <section id="suvadi-login-panel" style="padding:48px 20px;text-align:center;">
    <img src="icons/icon-192.png" alt="MTS Suvadi" width="96" height="96" style="border-radius:20px;">
    <h2>MTS சுவடி</h2>
    <p>Sign in with your child's MTS school Google account.</p>
    <button type="button" onclick="handleFirebaseSignIn()" style="padding:12px 20px;font-weight:700;cursor:pointer;">Sign in with Google</button>
    <div id="google-signin-status" style="margin-top:12px;font-weight:600;"></div>
  </section>

  <div id="suvadi-app-panel" hidden>
    <main>
      <div class="welcome" id="welcome">Welcome</div>
      <div id="student-list"></div>
      <div class="home-spacer"></div>
    </main>
    <nav class="bottom-nav">
      <a class="nav-item active" href="./index.html"><span class="nav-icon">⌂</span><span class="nav-label">MTS சுவடி</span></a>
      <a class="nav-item" data-my-books-link href="./books.html"><span class="nav-icon">📚</span><span class="nav-label">My Books</span></a>
    </nav>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    async function handleFirebaseSignIn() {
      const status = document.getElementById('google-signin-status');
      try {
        status.textContent = 'Signing in...';
        await signInSuvadi();
        status.textContent = 'Loading your library...';
        await initializeSuvadiHome();
      } catch (error) {
        console.error(error);
        status.textContent = error.message || 'Unable to sign in.';
      }
    }
    window.addEventListener('load', initializeSuvadiHome);
  </script>
</body>
</html>
