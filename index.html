<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             viewport-fit=cover"
  >

  <title>MTS சுவடி</title>


  <!-- PWA Manifest -->

  <link
    rel="manifest"
    href="manifest.json"
  >


  <meta
    name="theme-color"
    content="#0879dc"
  >


  <!-- Main Suvadi styles -->

  <link
    rel="stylesheet"
    href="styles.css"
  >


  <!-- Admin styles -->

  <link
    rel="stylesheet"
    href="admin.css"
  >

</head>


<body>


  <!--
   * ==========================================================
   * STARTUP / LOGIN SCREEN
   * ==========================================================
   *
   * Full-screen MTS Suvadi artwork.
   *
   * Firebase first checks whether the user is already logged in.
   *
   * If login is required, the Google button is displayed.
   * ==========================================================
   -->

  <div
    id="suvadi-login-panel"
    class="suvadi-startup-screen"
  >


    <!-- Full-screen loading artwork -->

    <img
      src="icons/suvadi-loading.png"
      alt="MTS சுவடி"
      class="suvadi-startup-image"
    >



    <!--
     * ========================================================
     * LOGIN CONTROLS
     * ========================================================
     *
     * Hidden initially.
     *
     * We show these only when Firebase determines that
     * the user needs to sign in.
     * ========================================================
     -->

    <div
      id="suvadi-login-controls"
      class="suvadi-login-controls"
      hidden
    >


      <button
        type="button"
        class="suvadi-google-signin"
        onclick="handleFirebaseSignIn()"
      >
        Sign in with Google
      </button>


      <div
        id="google-signin-status"
        class="suvadi-login-status"
      ></div>


    </div>


  </div>



  <!--
   * ==========================================================
   * APPLICATION
   * ==========================================================
   -->

  <div
    id="suvadi-app-panel"
    hidden
  >


    <!--
     * ========================================================
     * TOP HEADER
     * ========================================================
     -->

    <header class="topbar">


      <!-- Menu -->

      <button
        class="icon-button"
        type="button"
        aria-label="Menu"
        onclick="toggleSuvadiMenu()"
      >
        ☰
      </button>


      <!-- Logo -->

      <img
        class="app-logo"
        src="icons/mts-logo.png"
        alt="MTS"
      >


      <!-- App name -->

      <div class="page-title">
        MTS சுவடி
      </div>


      <div class="top-spacer"></div>


      <!-- Refresh -->

      <button
        class="icon-button"
        type="button"
        aria-label="Refresh"
        onclick="refreshSuvadiHome()"
      >
        ↻
      </button>


    </header>



    <!--
     * ========================================================
     * MENU
     * ========================================================
     -->

    <div
      id="suvadi-menu"
      hidden
      style="
        position: fixed;
        z-index: 50;
        top: 58px;
        left: 10px;
        background: white;
        padding: 12px;
        border-radius: 10px;
        box-shadow: 0 3px 18px #0003;
      "
    >


      <button
        class="admin-signout"
        type="button"
        onclick="signOutSuvadi()"
      >
        Sign out
      </button>


    </div>



    <!--
     * ========================================================
     * MAIN CONTENT
     * ========================================================
     -->

    <main>


      <!--
       * ======================================================
       * NORMAL STUDENT / FAMILY HOME
       * ======================================================
       -->

      <section
        id="family-home"
      >


        <div
          class="welcome"
          id="welcome"
        >
          Welcome
        </div>


        <div
          id="student-list"
        ></div>


        <div
          class="home-spacer"
        ></div>


      </section>



      <!--
       * ======================================================
       * ADMIN HOME
       * ======================================================
       -->

      <section
        id="admin-home"
        class="admin-main"
        hidden
      >


        <div
          class="admin-subtitle"
          id="admin-school"
        >
          Admin
        </div>


        <div
          class="admin-list"
          id="admin-class-list"
        >
          Loading...
        </div>


      </section>


    </main>



    <!--
     * ========================================================
     * BOTTOM NAVIGATION
     * ========================================================
     -->

    <nav class="bottom-nav">


      <!-- MTS சுவடி -->

      <a
        class="nav-item active"
        href="./index.html"
      >

        <span class="nav-icon">
          ⌂
        </span>

        <span class="nav-label">
          MTS சுவடி
        </span>

      </a>



      <!-- MY BOOKS -->

      <a
        id="my-books-nav"
        class="nav-item"
        data-my-books-link
        href="./books.html"
      >

        <span class="nav-icon">
          📚
        </span>

        <span class="nav-label">
          My Books
        </span>

      </a>


    </nav>


  </div>



  <!--
   * ==========================================================
   * FIREBASE
   * ==========================================================
   -->


  <script
    src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app-compat.js"
  ></script>


  <script
    src="https://www.gstatic.com/firebasejs/11.6.0/firebase-auth-compat.js"
  ></script>


  <script
    src="https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore-compat.js"
  ></script>



  <!--
   * ==========================================================
   * SUVADI SCRIPTS
   * ==========================================================
   -->


  <script src="firebase-config.js"></script>


  <script src="data.js"></script>


  <script src="app.js"></script>


  <script src="admin.js"></script>



  <!--
   * ==========================================================
   * PAGE FUNCTIONS
   * ==========================================================
   -->

  <script>


    /*
     * --------------------------------------------------------
     * SHOW GOOGLE LOGIN BUTTON
     * --------------------------------------------------------
     */

    function showSuvadiLoginControls() {

      const controls =
        document.getElementById(
          "suvadi-login-controls"
        );


      if (controls) {

        controls.hidden =
          false;

      }

    }



    /*
     * --------------------------------------------------------
     * HIDE GOOGLE LOGIN BUTTON
     * --------------------------------------------------------
     */

    function hideSuvadiLoginControls() {

      const controls =
        document.getElementById(
          "suvadi-login-controls"
        );


      if (controls) {

        controls.hidden =
          true;

      }

    }



    /*
     * --------------------------------------------------------
     * GOOGLE SIGN IN
     * --------------------------------------------------------
     */

    async function handleFirebaseSignIn() {

      const status =
        document.getElementById(
          "google-signin-status"
        );


      try {


        /*
         * Prevent double-click.
         */

        const button =
          document.querySelector(
            ".suvadi-google-signin"
          );


        if (button) {

          button.disabled =
            true;

        }



        if (status) {

          status.textContent =
            "Signing in...";

        }



        await signInSuvadi();



        if (status) {

          status.textContent =
            "Loading your library...";

        }



        await initializeSuvadiHome();


      }
      catch (error) {


        console.error(
          error
        );


        if (status) {

          status.textContent =
            error.message ||
            "Unable to sign in.";

        }



        /*
         * Re-enable button after error.
         */

        const button =
          document.querySelector(
            ".suvadi-google-signin"
          );


        if (button) {

          button.disabled =
            false;

        }


      }

    }



    /*
     * --------------------------------------------------------
     * REFRESH
     * --------------------------------------------------------
     */

    async function refreshSuvadiHome() {

      try {


        clearSuvadiDataCache();



        const data =
          await loadSuvadiData(
            true
          );



        /*
         * Admin
         */

        if (
          data.mode === "admin"
        ) {

          await loadAdminHome();

          return;

        }



        /*
         * Student / Family
         */

        const familyHome =
          document.getElementById(
            "family-home"
          );


        const adminHome =
          document.getElementById(
            "admin-home"
          );


        const myBooksNav =
          document.getElementById(
            "my-books-nav"
          );



        if (familyHome) {

          familyHome.hidden =
            false;

        }



        if (adminHome) {

          adminHome.hidden =
            true;

        }



        if (myBooksNav) {

          myBooksNav.hidden =
            false;

        }



        await loadHome();


      }
      catch (error) {


        console.error(
          "Unable to refresh MTS Suvadi:",
          error
        );


        alert(
          error.message ||
          "Unable to refresh."
        );


      }

    }



    /*
     * --------------------------------------------------------
     * START SUVADI
     * --------------------------------------------------------
     *
     * First wait for Firebase to determine whether a user
     * already has a valid login session.
     * --------------------------------------------------------
     */

    window.addEventListener(
      "load",

      async function() {


        /*
         * Keep loading artwork visible while
         * Firebase checks authentication.
         */

        hideSuvadiLoginControls();



        try {


          const user =
            await waitForFirebaseAuth();



          /*
           * Existing login.
           */

          if (user) {


            await initializeSuvadiHome();


          }


          /*
           * No existing login.
           *
           * Keep artwork visible and display
           * Google Sign In.
           */

          else {


            showSuvadiLoginControls();


          }


        }
        catch (error) {


          console.error(
            "Unable to initialize MTS Suvadi:",
            error
          );


          /*
           * Allow user to attempt sign-in.
           */

          showSuvadiLoginControls();


          const status =
            document.getElementById(
              "google-signin-status"
            );


          if (status) {

            status.textContent =
              error.message ||
              "Unable to load. Please sign in.";

          }


        }


      }
    );


  </script>


</body>

</html>
