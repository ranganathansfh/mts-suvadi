<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             viewport-fit=cover"
  >

  <title>MTS சுவடி - Students</title>


  <!-- Main Suvadi styles -->

  <link
    rel="stylesheet"
    href="styles.css"
  >


  <!-- Admin styles -->

  <link
    rel="stylesheet"
    href="admin.css"
  >

</head>


<body>


  <!--
   * ==========================================================
   * TOP HEADER
   * ==========================================================
   -->

  <header class="topbar">


    <!-- Back to MTS சுவடி / Class List -->

    <button
      class="icon-button"
      type="button"
      aria-label="Back"
      onclick="window.location.href='./index.html'"
    >
      ←
    </button>


    <!-- MTS Logo -->

    <img
      class="app-logo"
      src="icons/mts-logo.png"
      alt="MTS"
    >


    <!-- Selected Class Name -->

    <div
      class="page-title"
      id="admin-students-title"
    >
      Students
    </div>


    <div class="top-spacer"></div>


    <!-- Refresh -->

    <button
      class="icon-button"
      type="button"
      aria-label="Refresh"
      onclick="refreshAdminStudents()"
    >
      ↻
    </button>


  </header>



  <!--
   * ==========================================================
   * MAIN CONTENT
   * ==========================================================
   -->

  <main class="admin-main">


    <!--
     * School / Admin label
     *
     * Example:
     *
     * SCC Admin
     -->

    <div
      class="admin-subtitle"
      id="admin-school"
    >
      Admin
    </div>



    <!--
     * Student list gets generated by admin.js
     -->

    <div
      class="admin-list"
      id="admin-student-list"
    >
      Loading...
    </div>


  </main>



  <!--
   * ==========================================================
   * BOTTOM NAVIGATION
   * ==========================================================
   *
   * Admin no longer needs a separate Admin tab.
   *
   * MTS சுவடி takes the Admin back to the
   * class list on index.html.
   * ==========================================================
   -->

  <nav class="bottom-nav">


    <a
      class="nav-item active"
      href="./index.html"
    >

      <span class="nav-icon">
        ⌂
      </span>

      <span class="nav-label">
        MTS சுவடி
      </span>

    </a>


  </nav>



  <!--
   * ==========================================================
   * FIREBASE
   * ==========================================================
   -->

  <script
    src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app-compat.js"
  ></script>


  <script
    src="https://www.gstatic.com/firebasejs/11.6.0/firebase-auth-compat.js"
  ></script>


  <script
    src="https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore-compat.js"
  ></script>



  <!--
   * ==========================================================
   * SUVADI SCRIPTS
   * ==========================================================
   -->

  <script src="firebase-config.js"></script>

  <script src="data.js"></script>

  <script src="app.js"></script>

  <script src="admin.js"></script>



  <!--
   * ==========================================================
   * PAGE FUNCTIONS
   * ==========================================================
   -->

  <script>


    /*
     * ========================================================
     * REFRESH STUDENT LIST
     * ========================================================
     */

    async function refreshAdminStudents() {

      try {

        /*
         * Remove cached Firestore data.
         */

        clearSuvadiDataCache();


        /*
         * Reload fresh data.
         */

        await loadSuvadiData(
          true
        );


        /*
         * Redraw this class/student list.
         */

        await loadAdminStudents();

      }
      catch (error) {

        console.error(
          "Unable to refresh Admin students:",
          error
        );


        alert(
          error.message ||
          "Unable to refresh students."
        );

      }

    }



    /*
     * ========================================================
     * LOAD PAGE
     * ========================================================
     */

    window.addEventListener(
      "load",
      loadAdminStudents
    );


  </script>


</body>

</html>
